<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'none'"
  />
  <title>{{APP_NAME}}</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="command-bar" class="command-bar">
    <div class="cluster">
      <button id="btn-open" class="cmd-btn" data-i18n-title="titleOpen" data-i18n="open"></button>
      <button id="btn-undo" class="cmd-btn" data-i18n-title="titleUndo" data-i18n="undo"></button>
      <button id="btn-redo" class="cmd-btn" data-i18n-title="titleRedo" data-i18n="redo"></button>
    </div>
    <div class="cluster">
      <label class="field-label" for="input-bpm" data-i18n="bpmLabel"></label>
      <input id="input-bpm" class="num-input" type="text" inputmode="decimal" value="120" />
      <span class="beats-note">4/4</span>
      <label class="field-label" for="select-grid" data-i18n="gridLabel"></label>
      <select id="select-grid" class="select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="6">6</option>
        <option value="8" selected>8</option>
        <option value="12">12</option>
        <option value="16">16</option>
        <option value="24">24</option>
        <option value="32">32</option>
      </select>
      <button id="btn-snap" class="cmd-btn toggle on" data-i18n-title="titleSnap" data-i18n="snap"></button>
      <button id="btn-quantize" class="cmd-btn" data-i18n-title="titleQuantize" data-i18n="quantize"></button>
    </div>
    <div class="cluster">
      <button id="btn-copy" class="cmd-btn" data-i18n-title="titleCopy" data-i18n="copy"></button>
      <button id="btn-paste" class="cmd-btn" data-i18n-title="titlePaste" data-i18n="paste"></button>
    </div>
    <div class="cluster grow"></div>
    <div class="cluster">
      <button
        id="btn-bands"
        class="cmd-btn toggle bands-toggle"
        aria-pressed="false"
        data-i18n-title="titleBands"
      >
        <span class="swatch low"></span><span class="swatch mid"></span><span class="swatch high"></span><span class="bands-label" data-i18n="bands"></span>
      </button>
      <button id="btn-zoom-out" class="cmd-btn" data-i18n-title="titleZoomOut">&minus;</button>
      <button id="btn-zoom-in" class="cmd-btn" data-i18n-title="titleZoomIn">+</button>
      <button id="btn-marker" class="cmd-btn" data-i18n-title="titleMark" data-i18n="mark"></button>
      <button id="btn-export" class="cmd-btn primary" data-i18n-title="titleExport" data-i18n="export"></button>
      <select id="select-language" class="select lang-select" data-i18n-title="titleLanguage"></select>
    </div>
  </header>

  <section id="transport" class="transport">
    <button id="btn-play" class="tr-btn" data-i18n-title="titlePlay" data-i18n="play"></button>
    <button id="btn-stop" class="tr-btn" data-i18n-title="stop" data-i18n="stop"></button>
    <div class="tr-readout mono" id="readout-position"></div>
    <div class="cluster">
      <label class="field-label" for="select-cue" data-i18n="cueLabel"></label>
      <select id="select-cue" class="select">
        <option value="off" selected data-i18n="cueOff"></option>
        <option value="cowbell" data-i18n="cueCowbell"></option>
        <option value="triangle" data-i18n="cueTriangle"></option>
        <option value="metronome" data-i18n="cueMetronome"></option>
      </select>
      <input id="input-cue-vol" class="vol-slider" type="range" min="0" max="100" value="60" data-i18n-title="titleCueVolume" />
      <span id="rate-wrap" class="rate-wrap">
        <label class="field-label" for="select-rate" data-i18n="rateLabel"></label>
        <select id="select-rate" class="select" data-i18n-title="titleRate">
          <option value="0.25">0.25&times;</option>
          <option value="0.5">0.5&times;</option>
          <option value="0.75">0.75&times;</option>
          <option value="1" selected>1.0&times;</option>
          <option value="1.5">1.5&times;</option>
        </select>
      </span>
      <button id="btn-follow" class="cmd-btn toggle on" data-i18n-title="titleFollow" data-i18n="follow"></button>
      <button id="btn-calibrate" class="cmd-btn" data-i18n-title="titleCalibrate" data-i18n="calibrate"></button>
      <span id="tap-offset" class="tap-offset mono" data-i18n-title="titleTapOffset"></span>
    </div>
    <div class="grow"></div>
    <div class="cluster">
      <label class="field-label" for="input-shift" data-i18n="shiftLabel"></label>
      <input id="input-shift" class="num-input small" type="text" inputmode="decimal" value="0" />
      <label class="field-label" for="input-fade" data-i18n="fadeLabel"></label>
      <input id="input-fade" class="num-input small" type="text" inputmode="numeric" value="0" />
      <label class="field-label" for="input-gate" data-i18n="gateLabel"></label>
      <input id="input-gate" class="num-input small" type="text" inputmode="numeric" value="-48" />
      <label class="check-label"><input id="check-gate" type="checkbox" checked /> <span data-i18n="gateCheckbox"></span></label>
    </div>
  </section>

  <main id="workspace" class="workspace">
    <aside id="side-panel" class="side-panel">
      <div class="side-tabs">
        <button class="side-tab active" data-tab="source" data-i18n="tabSource"></button>
        <button class="side-tab" data-tab="cuts" data-i18n="tabCuts"></button>
        <button class="side-tab" data-tab="output" data-i18n="tabOutput"></button>
      </div>
      <div class="side-body" id="tab-source">
        <div class="kv"><span data-i18n="fileLabel"></span><em id="src-name">&mdash;</em></div>
        <div class="kv"><span data-i18n="formatLabel"></span><em id="src-format">&mdash;</em></div>
        <div class="kv"><span data-i18n="lengthLabel"></span><em id="src-length" class="mono">&mdash;</em></div>
        <div class="kv"><span data-i18n="durationLabel"></span><em id="src-duration" class="mono">&mdash;</em></div>
        <p class="hint" data-i18n="hintDropOrOpen"></p>
      </div>
      <div class="side-body hidden" id="tab-cuts">
        <details id="band-detect" class="band-detect" open>
          <summary><span data-i18n="bandDetect"></span> <span id="band-estimate" class="band-estimate mono"></span></summary>
          <div class="band-chips">
            <button class="band-chip on" data-band="low" aria-pressed="true" data-i18n="bandLow"></button>
            <button class="band-chip on" data-band="mid" aria-pressed="true" data-i18n="bandMid"></button>
            <button class="band-chip on" data-band="high" aria-pressed="true" data-i18n="bandHigh"></button>
          </div>
          <label class="band-field">
            <span data-i18n="riseLabel"></span>
            <input id="input-band-threshold" class="num-input small" type="number" step="0.5" min="1" max="24" value="6.0" />
            <span>dB</span>
          </label>
          <label class="band-field">
            <span data-i18n="minGapLabel"></span>
            <select id="select-band-gap" class="select">
              <option value="1" selected data-i18n="gap1Grid"></option>
              <option value="2" data-i18n="gap2Grid"></option>
              <option value="4" data-i18n="gap4Grid"></option>
              <option value="8" data-i18n="gap8Grid"></option>
            </select>
          </label>
          <div id="band-scope" class="band-scope"></div>
          <label class="check-label band-snap">
            <input id="check-band-snap" type="checkbox" checked />
            <span data-i18n="bandSnapLabel"></span>
          </label>
          <button id="btn-band-detect" class="cmd-btn wide" data-i18n="detect"></button>
        </details>
        <ul id="cut-list" class="cut-list"></ul>
      </div>
      <div class="side-body hidden" id="tab-output">
        <div class="kv"><span data-i18n="baseNameLabel"></span><input id="input-basename" class="text-input" value="slice" /></div>
        <div class="kv"><span data-i18n="clipStartNoLabel"></span><input id="input-clipnum" class="num-input small" value="1" /></div>
        <label class="check-label"><input id="check-ff" type="checkbox" /> <span data-i18n="ffNumberingLabel"></span></label>
        <button id="btn-export-one" class="cmd-btn wide" data-i18n-title="titleExportSlice" data-i18n="exportSliceAtCursor"></button>
        <button id="btn-bmse-out" class="cmd-btn wide" data-i18n-title="titleBmseOut" data-i18n="bmseOut"></button>
        <button id="btn-bmse-in" class="cmd-btn wide" data-i18n-title="titleBmseIn" data-i18n="bmseIn"></button>
        <button id="btn-save-wos" class="cmd-btn wide" data-i18n-title="saveWos" data-i18n="saveWos"></button>
        <button id="btn-load-wos" class="cmd-btn wide" data-i18n-title="loadWos" data-i18n="loadWos"></button>
        <button id="btn-edge" class="cmd-btn wide" data-i18n-title="titleEdgeDetect" data-i18n="edgeDetect"></button>
        <button id="btn-clear" class="cmd-btn wide danger" data-i18n-title="titleClearMarkers" data-i18n="clearMarkers"></button>
      </div>
    </aside>

    <section id="timeline-area" class="timeline-area">
      <canvas id="ruler-canvas" class="ruler" height="28"></canvas>
      <div id="wave-wrap" class="wave-wrap" tabindex="0">
        <canvas id="wave-canvas" class="wave"></canvas>
        <canvas id="overlay-canvas" class="overlay"></canvas>
        <div id="empty-hint" class="empty-hint">
          <div class="empty-title" data-i18n="emptyTitle"></div>
          <div class="empty-sub" data-i18n="emptySub"></div>
        </div>
      </div>
      <canvas id="overview-canvas" class="overview" height="36"></canvas>
      <div id="scrollbar" class="hscroll"><div id="scrollbar-thumb" class="hscroll-thumb"></div></div>
    </section>
  </main>

  <footer id="status-bar" class="status-bar">
    <span id="status-main" class="status-main"></span>
    <span id="status-right" class="status-right mono"></span>
  </footer>

  <div id="calibration-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h2 data-i18n="calibrationTitle"></h2>
      <p class="hint">
        <span data-i18n="calibrationHintPrefix"></span> <b id="calibration-bpm">120</b>
        <span data-i18n="calibrationHintBody"></span>
      </p>
      <div class="calibration-progress mono">
        <span><span data-i18n="beat"></span> <b id="calibration-beat">0</b></span>
        <span><span data-i18n="taps"></span> <b id="calibration-taps">0</b></span>
      </div>
      <div id="calibration-result" class="calibration-result mono hidden"></div>
      <div class="modal-actions">
        <button id="btn-calibration-retry" class="cmd-btn" data-i18n="restart"></button>
        <button id="btn-calibration-finish" class="cmd-btn" data-i18n="finish"></button>
        <button id="btn-calibration-apply" class="cmd-btn primary hidden" data-i18n="apply"></button>
        <button id="btn-calibration-close" class="cmd-btn" data-i18n="close"></button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
