<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'none'"
  />
  <title>woslicer-electron</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="command-bar" class="command-bar">
    <div class="cluster">
      <button id="btn-open" class="cmd-btn" title="Open WAV/OGG (Ctrl+O)">Open</button>
      <button id="btn-undo" class="cmd-btn" title="Undo (Ctrl+Z)">Undo</button>
      <button id="btn-redo" class="cmd-btn" title="Redo (Ctrl+Shift+Z)">Redo</button>
    </div>
    <div class="cluster">
      <label class="field-label" for="input-bpm">BPM</label>
      <input id="input-bpm" class="num-input" type="text" inputmode="decimal" value="120" />
      <span class="beats-note">4/4</span>
      <label class="field-label" for="select-grid">Grid</label>
      <select id="select-grid" class="select">
        <option value="4">4</option>
        <option value="6">6</option>
        <option value="8" selected>8</option>
        <option value="12">12</option>
        <option value="16">16</option>
        <option value="24">24</option>
        <option value="32">32</option>
      </select>
      <button id="btn-snap" class="cmd-btn toggle on" title="Snap to grid">Snap</button>
      <button id="btn-quantize" class="cmd-btn" title="Quantize markers to grid">Quantize</button>
    </div>
    <div class="cluster">
      <button id="btn-copy" class="cmd-btn" title="Copy measure markers (Ctrl+C)">Copy</button>
      <button id="btn-paste" class="cmd-btn" title="Paste measure markers (Ctrl+F / Ctrl+V)">Paste</button>
    </div>
    <div class="cluster grow"></div>
    <div class="cluster">
      <button id="btn-zoom-out" class="cmd-btn" title="Zoom out (-)">&minus;</button>
      <button id="btn-zoom-in" class="cmd-btn" title="Zoom in (+)">+</button>
      <button id="btn-marker" class="cmd-btn" title="Toggle marker at cursor (Z)">Mark</button>
      <button id="btn-export" class="cmd-btn primary" title="Export all slices (Ctrl+Shift+E)">Export</button>
    </div>
  </header>

  <section id="transport" class="transport">
    <button id="btn-play" class="tr-btn" title="Play / pause (Space when stopped)">Play</button>
    <button id="btn-stop" class="tr-btn" title="Stop">Stop</button>
    <div class="tr-readout mono" id="readout-position">M001&nbsp;&nbsp;00:00.000</div>
    <div class="cluster">
      <label class="field-label" for="select-cue">Cue</label>
      <select id="select-cue" class="select">
        <option value="off" selected>Off</option>
        <option value="cowbell">Cowbell</option>
        <option value="triangle">Triangle</option>
        <option value="metronome">Metronome</option>
      </select>
      <input id="input-cue-vol" class="vol-slider" type="range" min="0" max="100" value="60" title="Cue volume" />
      <button id="btn-follow" class="cmd-btn toggle on" title="Follow playhead">Follow</button>
    </div>
    <div class="grow"></div>
    <div class="cluster">
      <label class="field-label" for="input-shift">Shift</label>
      <input id="input-shift" class="num-input small" type="text" inputmode="decimal" value="0" />
      <label class="field-label" for="input-fade">Fade&nbsp;ms</label>
      <input id="input-fade" class="num-input small" type="text" inputmode="numeric" value="0" />
      <label class="field-label" for="input-gate">Gate&nbsp;dB</label>
      <input id="input-gate" class="num-input small" type="text" inputmode="numeric" value="-48" />
      <label class="check-label"><input id="check-gate" type="checkbox" checked /> gate</label>
    </div>
  </section>

  <main id="workspace" class="workspace">
    <aside id="side-panel" class="side-panel">
      <div class="side-tabs">
        <button class="side-tab active" data-tab="source">Source</button>
        <button class="side-tab" data-tab="cuts">Cuts</button>
        <button class="side-tab" data-tab="output">Output</button>
      </div>
      <div class="side-body" id="tab-source">
        <div class="kv"><span>File</span><em id="src-name">&mdash;</em></div>
        <div class="kv"><span>Format</span><em id="src-format">&mdash;</em></div>
        <div class="kv"><span>Length</span><em id="src-length" class="mono">&mdash;</em></div>
        <div class="kv"><span>Duration</span><em id="src-duration" class="mono">&mdash;</em></div>
        <p class="hint">Drop a WAV/OGG anywhere, or press Open.</p>
      </div>
      <div class="side-body hidden" id="tab-cuts">
        <ul id="cut-list" class="cut-list"></ul>
      </div>
      <div class="side-body hidden" id="tab-output">
        <div class="kv"><span>Base name</span><input id="input-basename" class="text-input" value="slice" /></div>
        <div class="kv"><span>Clip start no.</span><input id="input-clipnum" class="num-input small" value="1" /></div>
        <label class="check-label"><input id="check-ff" type="checkbox" /> FF numbering rule</label>
        <button id="btn-export-one" class="cmd-btn wide" title="Export slice at cursor (Ctrl+E)">Export slice at cursor</button>
        <button id="btn-bmse-out" class="cmd-btn wide" title="Copy BMSE clipboard (V)">BMSE clipboard out (V)</button>
        <button id="btn-bmse-in" class="cmd-btn wide" title="Read BMSE clipboard (B)">BMSE clipboard in (B)</button>
        <button id="btn-save-wos" class="cmd-btn wide" title="Save .wos (T)">Save .wos (T)</button>
        <button id="btn-load-wos" class="cmd-btn wide" title="Load .wos (Y)">Load .wos (Y)</button>
        <button id="btn-edge" class="cmd-btn wide" title="Auto edge detection">Edge detect</button>
        <button id="btn-clear" class="cmd-btn wide danger" title="Clear all markers (C)">Clear markers (C)</button>
      </div>
    </aside>

    <section id="timeline-area" class="timeline-area">
      <canvas id="ruler-canvas" class="ruler" height="28"></canvas>
      <div id="wave-wrap" class="wave-wrap" tabindex="0">
        <canvas id="wave-canvas" class="wave"></canvas>
        <canvas id="overlay-canvas" class="overlay"></canvas>
        <div id="empty-hint" class="empty-hint">
          <div class="empty-title">No source loaded</div>
          <div class="empty-sub">Drop a WAV / OGG here or press Open</div>
        </div>
      </div>
      <canvas id="overview-canvas" class="overview" height="36"></canvas>
      <div id="scrollbar" class="hscroll"><div id="scrollbar-thumb" class="hscroll-thumb"></div></div>
    </section>
  </main>

  <footer id="status-bar" class="status-bar">
    <span id="status-main" class="status-main">Empty: drop a WAV/OGG file to begin</span>
    <span id="status-right" class="status-right mono"></span>
  </footer>

  <script type="module" src="renderer/app.js"></script>
</body>
</html>
