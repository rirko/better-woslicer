[package]
name = "woslicer-dx"
version = "0.0.0"
# This private host crate has no independently editable application version.
# Tauri reads the application version directly from ../package.json.
edition = "2024"
rust-version = "1.99"
publish = false
build = "build.rs"

# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name obvious to the user; the desktop binary
# and future mobile targets share this library entry point.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
rfd = "0.15"
clipboard-rs = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Keep local dev/test incremental and unoptimized (Cargo defaults).
# CI tests, Clippy and bundles share this size-oriented release profile.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
