name: Publish prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      optional_platforms: true

  release:
    name: Publish verified web and desktop artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: woslicer-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Check release version and required artifacts
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          test -s "release-assets/$name-$version-web.zip"
          compgen -G "release-assets/${name}_${version}_x64*.msi" > /dev/null
          compgen -G "release-assets/${name}_${version}_x64-setup.exe" > /dev/null
          unzip -t "release-assets/$name-$version-web.zip"
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          {
            echo "Prerelease of $name $version."
            echo
            echo "Source commit: $GITHUB_SHA"
            echo
            echo 'Web and Windows x64 passed the required build checks.'
            echo 'Windows ARM64 and Linux packages are included only when their optional builds succeed.'
            echo 'Windows uses the standard Tauri MSI and NSIS installers.'
          } > release-notes.md
      - name: Publish immediately as a public prerelease (never a manual draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="$(node -p '`${require("./package.json").name} ${require("./package.json").version}`')"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false --title "$title" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --latest=false --title "$title" --notes-file release-notes.md
          fi

  deploy-pages:
    name: Deploy the verified web release to Cloudflare Pages
    needs: release
    if: vars.CLOUDFLARE_PROJECT_NAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: woslicer-web-${{ github.sha }}
          path: release-assets
      - name: Unpack the tested static site
        run: |
          mkdir site
          unzip -q release-assets/*-web.zip -d site
          test -f site/index.html
      - name: Require configured deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}
