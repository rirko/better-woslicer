name: Release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Promote CI artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Find and wait for CI by commit SHA
        id: ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/wait-for-ci.js

      - name: Download artifacts from the matching CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: woslicer-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Validate tag, required package and checksums
        run: node scripts/prepare-release.js "$GITHUB_REF_NAME" release-assets release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft --verify-tag \
            --title "woslicer-electron $version" \
            --notes-file release-notes.md
