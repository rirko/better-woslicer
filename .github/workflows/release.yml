name: Publish prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      optional_platforms: true

  release:
    name: Publish verified web and desktop artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: woslicer-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Verify release assets and prepare release notes
        id: prepare
        run: bash .github/scripts/prepare-release.sh
      - name: Publish public prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: ${{ steps.prepare.outputs.title }}
        run: bash .github/scripts/publish-release.sh

  deploy-pages:
    name: Deploy the verified web release to Cloudflare Pages
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require configured Pages deployment
        env:
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_PROJECT_NAME CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Pages configuration: $name" >&2
              exit 1
            fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: woslicer-web-${{ github.sha }}
          path: release-assets
      - name: Unpack the tested static site
        run: |
          mkdir site
          unzip -q release-assets/*-web.zip -d site
          test -f site/index.html
      - name: Read the Direct Upload production target
        id: pages-project
        env:
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --show-error --silent --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME" \
            -o pages-project.json
          branch=$(jq -er 'select(.success == true) | .result.production_branch | select(type == "string" and length > 0) | @json' pages-project.json)
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=${{ steps.pages-project.outputs.branch }} --commit-hash=${{ github.sha }}
      - name: Verify the deployed build identity
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PAGES_ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
        run: |
          if [[ "$PAGES_ENVIRONMENT" != production ]]; then
            echo "Expected a production deployment for the existing Direct Upload project" >&2
            exit 1
          fi
          test -n "$DEPLOYMENT_URL"
          curl --fail --show-error --silent --location --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "${DEPLOYMENT_URL%/}/build-info.json" -o deployed-build-info.json
          cmp site/build-info.json deployed-build-info.json
