name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows-x64
          - os: ubuntu-24.04
            label: linux-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Prepare Linux display and audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio dbus-x11 xz-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
          # Allow Chromium's user-namespace sandbox on this disposable hosted VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Windows UI tests (30 seconds per display profile)
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Linux UI tests (30 seconds per display profile)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 2560x1440x24' npm run test:ui
      - name: Package native application
        run: npm run package
      - name: Windows packaged-app UI tests
        if: runner.os == 'Windows'
        run: npm run test:ui:packaged
      - name: Linux packaged-app UI tests
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 2560x1440x24' npm run test:ui:packaged
      - name: Upload application archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: woslicer-${{ matrix.label }}-${{ github.sha }}
          path: |
            release/*.7z
            release/*.tar.xz
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload UI diagnostics
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-diagnostics-${{ matrix.label }}-${{ github.sha }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
