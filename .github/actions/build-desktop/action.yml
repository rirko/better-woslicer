name: Build and validate a Tauri desktop target
description: Native Rust checks, cached dependencies and default Tauri bundles
inputs:
  platform:
    required: true
    description: Release platform label
  target:
    required: true
    description: Native Rust target triple
  profile:
    required: true
    description: Native build profile (debug or release)
  bundles:
    required: false
    description: Comma-separated Tauri bundle formats for Linux and macOS
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
    - name: Set build environment before restoring Cargo caches
      shell: bash
      env:
        BUILD_PROFILE: ${{ inputs.profile }}
      run: |
        case "$BUILD_PROFILE" in debug|release) ;; *) exit 1 ;; esac
        echo "WOSLICER_BUILD_PROFILE=$BUILD_PROFILE" >> "$GITHUB_ENV"
        echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
        if [[ "$RUNNER_OS" == macOS ]]; then
          echo "MACOSX_DEPLOYMENT_TARGET=$(node -p 'require("./src-tauri/tauri.conf.json").bundle.macOS.minimumSystemVersion')" >> "$GITHUB_ENV"
        fi
    - name: Install locked frontend dependencies
      shell: bash
      run: npm ci
    - name: Install the pinned Rust toolchain with native checks
      shell: bash
      env:
        RUST_TARGET: ${{ inputs.target }}
      run: |
        rustup toolchain install --no-self-update
        rustup show active-toolchain
        rustup target add "$RUST_TARGET"
    - name: Install Linux bundler dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64
    - name: Cache Cargo registry and target dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: src-tauri -> target
        shared-key: tauri-${{ inputs.profile }}-${{ runner.os }}-${{ inputs.target }}
        env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
        # Default-branch caches are readable by PRs and dev.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Build frontend and generate identity before Cargo
      shell: bash
      run: npm run build:app:tauri -- --release
    - name: Rust format, tests and Clippy
      shell: bash
      env:
        RUST_TARGET: ${{ inputs.target }}
        CARGO_LOG: ${{ runner.os == 'macOS' && 'cargo::core::compiler::fingerprint=info' || '' }}
      run: |
        profile_args=()
        if [[ "$WOSLICER_BUILD_PROFILE" == release ]]; then profile_args+=(--release); fi
        cargo fmt --manifest-path src-tauri/Cargo.toml --check
        cargo test --manifest-path src-tauri/Cargo.toml --locked "${profile_args[@]}" --target "$RUST_TARGET" --all-features
        cargo clippy --manifest-path src-tauri/Cargo.toml --locked "${profile_args[@]}" --target "$RUST_TARGET" --all-targets --all-features -- -D warnings
    - name: Build the Windows executable
      if: runner.os == 'Windows'
      shell: bash
      env:
        RUST_TARGET: ${{ inputs.target }}
      # Both builds reuse the frontend prepared for Cargo checks.
      run: >-
        npm run tauri -- build --ci --config '{"build":{"beforeBuildCommand":""}}'
        --target "$RUST_TARGET" --no-bundle -- --locked
    - name: Build Linux and macOS bundles
      if: runner.os != 'Windows'
      shell: bash
      env:
        RUST_TARGET: ${{ inputs.target }}
        TAURI_BUNDLES: ${{ inputs.bundles }}
        CARGO_LOG: ${{ runner.os == 'macOS' && 'cargo::core::compiler::fingerprint=info' || '' }}
      run: >-
        npm run tauri -- build --ci --config '{"build":{"beforeBuildCommand":""}}'
        --target "$RUST_TARGET" --bundles "$TAURI_BUNDLES" -- --locked
    - name: Package the Windows portable ZIP
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        RELEASE_PLATFORM: ${{ inputs.platform }}
        RUST_TARGET: ${{ inputs.target }}
      run: ./.github/scripts/package-windows-portable.ps1
    - name: Verify and collect Linux packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        RELEASE_PLATFORM: ${{ inputs.platform }}
        RUST_TARGET: ${{ inputs.target }}
      run: bash .github/scripts/collect-linux.sh
    - name: Verify and collect macOS disk images
      if: runner.os == 'macOS'
      shell: bash
      env:
        RELEASE_PLATFORM: ${{ inputs.platform }}
        RUST_TARGET: ${{ inputs.target }}
      run: bash .github/scripts/collect-macos.sh
    - name: Record artifact identity and checksums
      shell: bash
      env:
        RELEASE_PLATFORM: ${{ inputs.platform }}
      run: node scripts/release-artifacts.mjs record "release/$RELEASE_PLATFORM" "$RELEASE_PLATFORM"
    - name: Upload complete platform artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: woslicer-${{ inputs.platform }}-${{ inputs.profile }}-${{ github.sha }}
        path: release/${{ inputs.platform }}/*
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 14
    - name: Upload desktop diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: diagnostics-${{ inputs.platform }}-${{ inputs.profile }}-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          test-artifacts/
          src-tauri/generated/build-info.json
        if-no-files-found: ignore
        retention-days: 7
